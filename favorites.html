<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites | Student Laptop Finder</title>
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="flex min-h-screen flex-col">
  <header id="site-header" class="bg-[var(--card-bg)]"></header>
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <h1 class="text-2xl font-bold">My Favorites</h1>
<p class="mt-2">Your saved laptops.</p>
<div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
  <div class="laptop-card"><h2 class="font-semibold">Saved Laptops</h2><p id="saved-count" class="mt-2 text-2xl">--</p></div>
  <div class="laptop-card"><h2 class="font-semibold">Total Price</h2><p id="total-price" class="mt-2 text-2xl">--</p></div>
  <div class="laptop-card"><h2 class="font-semibold">Average Price</h2><p id="average-price" class="mt-2 text-2xl">--</p></div>
</div>
<button id="clear-favorites" type="button" class="btn-action mt-6">Clear All Favorites</button>
<p id="favorites-status" role="status" class="mt-4"></p>
<div id="favorites-list" class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>
  <footer id="site-footer" class="bg-[var(--card-bg)]"></footer>
  <script type="module" src="./src/js/ui.js"></script>
  <script type="module" src="./src/js/favorites.js"></script>
</body>
</html>
